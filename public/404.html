<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | 공부시간</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f5f6fa; --card: #ffffff; --text: #1d2130; --muted: #6b7185; --accent: #4F7CFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12141b; --card: #1c1f29; --text: #eef0f6; --muted: #9aa0b4; --accent: #6f93ff; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border-radius: 16px; padding: 32px 24px; max-width: 420px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요.</p>
  <a href="/">공부시간 타이머로 가기</a>
</main>
</body>
</html>
